name: Autonomous blog agent

on:
  # Off-hour minute: the top of the hour is the most contended cron slot on
  # shared runners, and a delayed start there is routine.
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: What the run is allowed to do
        type: choice
        options: [auto, research-only, force-publish]
        default: auto
      dry_run:
        description: Generate and validate without committing
        type: boolean
        default: false

concurrency:
  group: blog-agent
  # Never interrupt a run that may be mid-publish. Write-ahead state covers the
  # crash case, but not interrupting is cheaper than reconciling.
  cancel-in-progress: false

permissions:
  contents: write # push bot/* and the state branch
  pull-requests: write # open the PR

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The site build is needed because the MDX gate runs the real contentlayer
      # build in a throwaway worktree that symlinks these node_modules.
      - name: Install site dependencies
        run: corepack enable && yarn install --immutable

      - name: Install agent dependencies
        working-directory: tools/blog-agent
        run: npm ci

      - name: Verify agent
        working-directory: tools/blog-agent
        run: npm run verify

      - name: Run agent
        working-directory: tools/blog-agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEXT_MODEL: ${{ vars.GEMINI_TEXT_MODEL || 'gemini-3.5-flash' }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL || 'imagen-4.0-generate-001' }}
          GEMINI_EMBEDDING_MODEL: ${{ vars.GEMINI_EMBEDDING_MODEL || 'gemini-embedding-2-preview' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LOG_FORMAT: json
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          case "${{ inputs.mode || 'auto' }}" in
            research-only) npm run start -- run --research-only ;;
            force-publish) npm run start -- run --force-publish ;;
            *)             npm run start -- run ;;
          esac

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: blog-agent-artifacts
          path: tools/blog-agent/.artifacts/
          retention-days: 7
          if-no-files-found: ignore
