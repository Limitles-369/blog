name: Scheduled Blog Agent Pipeline

on:
  schedule:
    - cron: '37 4,16 * * *'
  workflow_dispatch:

concurrency:
  group: auto-blog-agent
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure Git identity
        run: |
          git config user.name "blog-agent[bot]"
          git config user.email "blog-agent[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: |
          corepack enable
          yarn install --immutable || yarn install
          npm ci --prefix tools/blog-agent

      - name: Run Blog Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEXT_MODEL: ${{ vars.GEMINI_TEXT_MODEL || 'gemini-3.5-flash-lite' }}
          GEMINI_EMBEDDING_MODEL: ${{ vars.GEMINI_EMBEDDING_MODEL || 'gemini-embedding-2-preview' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MAX_GEMINI_REQUESTS_PER_DAY: '18'
          MIN_TOPIC_QUEUE_DEPTH: '5'
          LOG_FORMAT: json
        run: npx tsx tools/blog-agent/src/cli.ts run
